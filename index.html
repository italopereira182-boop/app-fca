<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema FCA - Fato, Causa e Ação</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    .tree-branch {
      position: relative;
      padding-left: 1.75rem;
    }
    .tree-branch::before {
      content: '';
      position: absolute;
      left: 0.75rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #cbd5e1;
    }
    .tree-node-wrapper {
      position: relative;
    }
    .tree-node-wrapper::before {
      content: '';
      position: absolute;
      left: -1rem;
      top: 1.5rem;
      width: 1rem;
      height: 2px;
      background-color: #cbd5e1;
    }
    .tree-branch > .tree-node-wrapper:last-child::after {
      content: '';
      position: absolute;
      left: -1.1rem;
      top: 1.55rem;
      bottom: 0;
      width: 4px;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg">
          <i data-lucide="git-fork" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Gestão FCA & Árvore de Causas</h1>
          <p class="text-xs text-slate-400">Análise de Problemas e Plano de Ação</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-sm px-3 py-2 rounded-lg border border-slate-700 transition">
          <i data-lucide="download" class="w-4 h-4"></i> Exportar Dados
        </button>
        <label class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-sm px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition">
          <i data-lucide="upload" class="w-4 h-4"></i> Importar
          <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)" />
        </label>
        <button onclick="openNewFcaModal()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg shadow transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Novo FCA
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Barra Lateral: Lista de FCAs -->
    <aside class="lg:col-span-3 space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Registros de Fato</h2>
        <div id="fcaList" class="space-y-2"></div>
      </div>
    </aside>

    <!-- Área de Trabalho do FCA Selecionado -->
    <section id="workspace" class="lg:col-span-9 space-y-6"></section>

  </main>

  <!-- Modal: Novo FCA -->
  <div id="newFcaModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-4">Registrar Novo Fato (Problema)</h3>
      <form onsubmit="createFca(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Título do Fato *</label>
          <input type="text" id="fcaTitleInput" required placeholder="Ex: Atraso na entrega do lote #402" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Descrição / Contexto</label>
          <textarea id="fcaDescInput" rows="3" placeholder="Detalhes do ocorrido, impacto, data..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('newFcaModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">Criar Análise</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Adicionar Causa -->
  <div id="addCauseModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-1">Adicionar Causa (Por quê?)</h3>
      <p id="parentCauseLabel" class="text-xs text-slate-500 mb-4 truncate"></p>
      <form onsubmit="saveCause(event)" class="space-y-4">
        <input type="hidden" id="parentNodeIdInput" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Descrição da Causa *</label>
          <input type="text" id="causeTextInput" required placeholder="Ex: Falta de matéria-prima no estoque" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="isRootCauseInput" class="rounded text-purple-600 focus:ring-purple-500" />
          <label for="isRootCauseInput" class="text-sm text-slate-700 font-medium">Marcar como Causa Raiz</label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('addCauseModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-lg">Adicionar à Árvore</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Adicionar Ação (5W2H) -->
  <div id="addActionModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900 mb-1">Novo Plano de Ação</h3>
      <p id="actionCauseLabel" class="text-xs text-slate-500 mb-4 truncate"></p>
      <form onsubmit="saveAction(event)" class="space-y-4">
        <input type="hidden" id="actionCauseIdInput" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">O que será feito? (Ação) *</label>
          <input type="text" id="actionWhatInput" required placeholder="Ex: Configurar alerta de estoque mínimo" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Responsável *</label>
            <input type="text" id="actionWhoInput" required placeholder="Ex: João Silva" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Prazo *</label>
            <input type="date" id="actionWhenInput" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Status Inicial</label>
          <select id="actionStatusInput" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('addActionModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg">Salvar Ação</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        id: 'fca-1',
        title: 'Parada não programada na Linha 2',
        description: 'A linha ficou parada por 2 horas durante o turno da manhã gerando atraso na expedição.',
        createdAt: new Date().toLocaleDateString('pt-BR'),
        tree: {
          id: 'root',
          text: 'Parada não programada na Linha 2',
          children: [
            {
              id: 'c-1',
              text: 'Superaquecimento do motor principal',
              isRootCause: false,
              children: [
                {
                  id: 'c-2',
                  text: 'Filtro de ventilação obstruído por poeira',
                  isRootCause: true,
                  children: []
                }
              ]
            },
            {
              id: 'c-3',
              text: 'Demora na chegada da equipe de manutenção',
              isRootCause: false,
              children: []
            }
          ]
        },
        actions: [
          {
            id: 'act-1',
            causeId: 'c-2',
            causeText: 'Filtro de ventilação obstruído por poeira',
            what: 'Incluir limpeza semanal do filtro no checklist preventivo',

}
function renderWorkspace() {
const workspaceEl = document.getElementById('workspace');
const fca = fcaRecords.find(item => item.id === selectedFcaId);
if (!fca) {
workspaceEl.innerHTML = <div class="bg-white p-12 rounded-xl border border-slate-200 text-center"> <i data-lucide="folder-open" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i> <h3 class="text-lg font-semibold text-slate-700">Nenhum FCA selecionado</h3> <p class="text-sm text-slate-500 mb-4">Selecione um registro ao lado ou crie um novo Fato para analisar.</p> <button onclick="openNewFcaModal()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700">Criar Novo FCA</button> </div>;
return;
}
workspaceEl.innerHTML = `




FATO / PROBLEMA

${fca.title}
${fca.description || 'Sem descrição adicional.'}

Criado em: ${fca.createdAt}

 Árvore de Causas (Por quês)

Ramifique as causas a partir do fato até encontrar a Causa Raiz.


 Fato
 Causa
 Causa Raiz

${renderTreeNode(fca.tree, true)}

 Plano de Ação (5W2H)

Ações vinculadas às causas identificadas na árvore acima.

${renderActionsTable(fca.actions)}

`;
}
function renderTreeNode(node, isRoot = false) {
let badgeHtml = '';
let cardStyle = '';
if (isRoot) {
cardStyle = 'bg-red-50 border-red-300 text-red-950';
badgeHtml = <span class="text-[10px] font-bold uppercase tracking-wider bg-red-600 text-white px-2 py-0.5 rounded">Fato</span>;
} else if (node.isRootCause) {
cardStyle = 'bg-purple-50 border-purple-400 text-purple-950 ring-2 ring-purple-200';
badgeHtml = <span class="text-[10px] font-bold uppercase tracking-wider bg-purple-600 text-white px-2 py-0.5 rounded">Causa Raiz</span>;
} else {
cardStyle = 'bg-amber-50 border-amber-300 text-amber-950';
badgeHtml = <span class="text-[10px] font-bold uppercase tracking-wider bg-amber-500 text-white px-2 py-0.5 rounded">Causa</span>;
}
const childrenHtml = node.children && node.children.length > 0
? <div class="tree-branch mt-3 space-y-3"> ${node.children.map(child => ${renderTreeNode(child, false)}).join('')} </div>
: '';
return `




${badgeHtml}
${node.text}

 Por quê?

${!isRoot ? <button onclick="toggleRootCause('${node.id}')" title="Alternar Causa Raiz" class="text-xs bg-white hover:bg-purple-100 text-purple-700 border border-purple-300 px-2 py-1.5 rounded-lg transition"> <i data-lucide="target" class="w-3.5 h-3.5"></i> </button> <button onclick="openAddActionModal('${node.id}', '${escapeQuotes(node.text)}')" title="Criar Plano de Ação para esta causa" class="flex items-center gap-1 text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg font-medium transition"> <i data-lucide="zap" class="w-3.5 h-3.5"></i> Ação </button> <button onclick="deleteNode('${node.id}')" title="Remover Causa" class="text-xs bg-white hover:bg-red-100 text-red-600 border border-slate-300 p-1.5 rounded-lg transition"> <i data-lucide="x" class="w-3.5 h-3.5"></i> </button> : ''}


${childrenHtml}

`;
}
function renderActionsTable(actions) {
if (!actions || actions.length === 0) {
return <div class="text-center py-8 bg-slate-50 rounded-lg border border-dashed border-slate-300 text-sm text-slate-500"> Nenhuma ação cadastrada ainda. Clique no botão <strong>"Ação"</strong> em qualquer causa da árvore acima para criar um plano. </div>;
}
return `
${actions.map(act => `
`).join('')}

Causa Vinculada	O que fazer (Ação)	Responsável	Prazo	Status	Excluir
${act.causeText}
	${act.what}	${act.who}	${formatDate(act.when)}		

`;
}
function selectFca(id) {
selectedFcaId = id;
renderApp();
}
function createFca(e) {
e.preventDefault();
const title = document.getElementById('fcaTitleInput').value.trim();
const description = document.getElementById('fcaDescInput').value.trim();
if (!title) return;
const newFca = {
id: 'fca-' + Date.now(),
title,
description,
createdAt: new Date().toLocaleDateString('pt-BR'),
tree: { id: 'root', text: title, children: [] },
actions: []
};
fcaRecords.unshift(newFca);
selectedFcaId = newFca.id;
closeModal('newFcaModal');
e.target.reset();
saveData();
}
function deleteFca(e, id) {
e.stopPropagation();
if (!confirm('Deseja excluir este registro de FCA?')) return;
fcaRecords = fcaRecords.filter(item => item.id !== id);
if (selectedFcaId === id) {
selectedFcaId = fcaRecords.length > 0 ? fcaRecords[0].id : null;
}
saveData();
}
function saveCause(e) {
e.preventDefault();
const parentId = document.getElementById('parentNodeIdInput').value;
const text = document.getElementById('causeTextInput').value.trim();
const isRootCause = document.getElementById('isRootCauseInput').checked;
if (!text) return;
const fca = fcaRecords.find(item => item.id === selectedFcaId);
const newNode = {
id: 'c-' + Date.now(),
text,
isRootCause,
children: []
};
function insertNode(current) {
if (current.id === parentId) {
current.children.push(newNode);
return true;
}
for (let child of current.children) {
if (insertNode(child)) return true;
}
return false;
}
insertNode(fca.tree);
closeModal('addCauseModal');
e.target.reset();
saveData();
}
function toggleRootCause(nodeId) {
const fca = fcaRecords.find(item => item.id === selectedFcaId);
function toggle(current) {
if (current.id === nodeId) {
current.isRootCause = !current.isRootCause;
return true;
}
for (let child of current.children) {
if (toggle(child)) return true;
}
return false;
}
toggle(fca.tree);
saveData();
}
function deleteNode(nodeId) {
if (!confirm('Remover esta causa e suas ramificações?')) return;
const fca = fcaRecords.find(item => item.id === selectedFcaId);
function remove(current) {
current.children = current.children.filter(child => child.id !== nodeId);
current.children.forEach(remove);
}
remove(fca.tree);
saveData();
}
function saveAction(e) {
e.preventDefault();
const causeId = document.getElementById('actionCauseIdInput').value;
const causeText = document.getElementById('actionCauseLabel').dataset.rawText;
const what = document.getElementById('actionWhatInput').value.trim();
const who = document.getElementById('actionWhoInput').value.trim();
const when = document.getElementById('actionWhenInput').value;
const status = document.getElementById('actionStatusInput').value;
const fca = fcaRecords.find(item => item.id === selectedFcaId);
fca.actions.push({
id: 'act-' + Date.now(),
causeId,
causeText,
what,
who,
when,
status
});
closeModal('addActionModal');
e.target.reset();
saveData();
}
function updateActionStatus(actionId, newStatus) {
const fca = fcaRecords.find(item => item.id === selectedFcaId);
const act = fca.actions.find(a => a.id === actionId);
if (act) act.status = newStatus;
saveData();
}
function deleteAction(actionId) {
const fca = fcaRecords.find(item => item.id === selectedFcaId);
fca.actions = fca.actions.filter(a => a.id !== actionId);
saveData();
}
function exportData() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fcaRecords, null, 2));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", "backup-fca-" + new Date().toISOString().slice(0,10) + ".json");
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();
}
function importData(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
try {
const imported = JSON.parse(e.target.result);
if (Array.isArray(imported)) {
fcaRecords = imported;
selectedFcaId = fcaRecords.length > 0 ? fcaRecords[0].id : null;
saveData();
alert('Dados importados com sucesso!');
}
} catch (err) {
alert('Erro ao ler arquivo JSON.');
}
};
reader.readAsText(file);
}
function openNewFcaModal() {
document.getElementById('newFcaModal').classList.replace('hidden', 'flex');
}
function openAddCauseModal(parentId, parentText) {
document.getElementById('parentNodeIdInput').value = parentId;
document.getElementById('parentCauseLabel').textContent = 'Decorrente de: ' + parentText;
document.getElementById('addCauseModal').classList.replace('hidden', 'flex');
}
function openAddActionModal(causeId, causeText) {
document.getElementById('actionCauseIdInput').value = causeId;
const label = document.getElementById('actionCauseLabel');
label.textContent = 'Para a causa: ' + causeText;
label.dataset.rawText = causeText;
document.getElementById('addActionModal').classList.replace('hidden', 'flex');
}
function closeModal(modalId) {
document.getElementById(modalId).classList.replace('flex', 'hidden');
}
function getStatusStyle(status) {
if (status === 'Concluído') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
if (status === 'Em Andamento') return 'bg-blue-100 text-blue-800 border-blue-300';
return 'bg-slate-100 text-slate-700 border-slate-300';
}
function formatDate(dateStr) {
if (!dateStr) return '-';
const [y, m, d] = dateStr.split('-');
return ${d}/${m}/${y};
}
function escapeQuotes(str) {
return str.replace(/'/g, "\'").replace(/"/g, '"');
}
renderApp();
